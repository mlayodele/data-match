[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasoning-engine-v2"
version = "0.1.0"
description = "Guides users through defining unified schemas for aggregating data across inconsistently-structured files"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.27.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "google-cloud-storage>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_match"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
